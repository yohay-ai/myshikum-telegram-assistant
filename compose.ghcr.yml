services:
  myshikum-assistant:
    image: ghcr.io/yohay-ai/myshikum-telegram-assistant:latest
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "rehab_checker_bot.py", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    env_file:
      - .env
    environment:
      STATE_DIR: /app/state
      HEADLESS: "true"
    volumes:
      - myshikum-state:/app/state

volumes:
  myshikum-state:
