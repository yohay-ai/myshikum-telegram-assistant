name: Docker build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: myshikum-telegram-assistant:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run unit tests in image
        run: >-
          docker run --rm
          -e TELEGRAM_TOKEN=test-token
          -e AUTHORIZED_CHAT_ID=123
          -e PERSONAL_ID=000000000
          -e OTP_CHANNEL=phone
          -e OTP_CONTACT=0500000000
          myshikum-telegram-assistant:test
          python -m unittest discover -s tests -v
      - name: Container smoke check
        run: >-
          docker run --rm
          -e TELEGRAM_TOKEN=test-token
          -e AUTHORIZED_CHAT_ID=123
          -e PERSONAL_ID=000000000
          -e OTP_CHANNEL=phone
          -e OTP_CONTACT=0500000000
          myshikum-telegram-assistant:test
          python -c "import rehab_checker_bot as b; assert not b.valid_config(); print('smoke-ok')"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yohay-ai/myshikum-telegram-assistant
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
